<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GNSS Data Analysis — Map</title>
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css" />
<link rel="stylesheet" href="/static/vendor/leaflet-draw/leaflet.draw.css" />
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { background: #1f3a5f; color: #fff; padding: 10px 16px; }
  header h2 { margin: 0; font-size: 18px; }
  header a { color: #bad7ff; font-size: 13px; }
  #split { display: flex; height: calc(100vh - 52px); }
  #left { width: 380px; min-width: 320px; max-width: 460px; overflow-y: auto; padding: 16px; background: #f7f9fc; border-right: 1px solid #dde3ea; }
  #right { flex: 1; position: relative; }
  #map { position: absolute; inset: 0; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 13px; font-weight: 600; color: #343a40; margin-bottom: 4px; }
  .field input, .field select { width: 100%; padding: 7px 9px; font-size: 14px; border: 1px solid #b9c4d0; border-radius: 4px; }
  .row2 { display: flex; gap: 8px; }
  .row2 .field { flex: 1; }
  .btn { display: inline-block; border: 0; border-radius: 4px; padding: 8px 12px; font-size: 14px; cursor: pointer; margin: 4px 4px 4px 0; }
  .btn-dark { background: #343a40; color: #fff; }
  .btn-warn { background: #ffc107; color: #212529; }
  .btn-go { background: #28a745; color: #fff; width: 100%; font-size: 15px; font-weight: 700; }
  .btn:disabled { opacity: .6; cursor: not-allowed; }
  .check { font-size: 14px; margin: 6px 0; display: block; }
  .hint { font-size: 12px; color: #6c757d; }
  #outputs { margin-top: 14px; border: 2px solid #416c41; background: #bad7ff; border-radius: 4px; padding: 8px; font-size: 13px; display: none; }
  #outputs h4 { margin: 4px 0 8px; }
  #outputs a { color: #000; }
  #spinner { display: none; margin: 10px 0; color: #28a745; font-weight: 600; }
  .spin { display: inline-block; width: 16px; height: 16px; border: 3px solid #cfe9d4; border-top-color: #28a745; border-radius: 50%; animation: sp 0.8s linear infinite; vertical-align: -3px; margin-right: 6px; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .legend { background: rgba(255,255,255,.9); padding: 6px 8px; border-radius: 5px; box-shadow: 0 0 15px rgba(0,0,0,.2); }
  .legend img { max-width: 220px; display: block; }
  #rectInfo { font-size: 12px; color: #155724; background: #d4edda; border-radius: 4px; padding: 6px 8px; margin: 6px 0; display: none; }
  @media (max-width: 820px) { #split { flex-direction: column; height: auto; } #left { width: 100%; max-width: none; } #right { height: 70vh; } }
</style>
</head>
<body>
<header>
  <h2>GNSS Data Analysis <span style="font-weight:400;font-size:13px">— online interface for GNSS tools</span></h2>
  <a href="/gpsservice/test">API status</a> &nbsp;·&nbsp; <a href="/docs">OpenAPI docs</a>
</header>
<div id="split">
  <!-- LEFT PANEL : model + parameters (mirrors reference/GNSS.vue) -->
  <div id="left">
    <h3 style="text-align:center;margin-top:0">GNSS Data Analysis</h3>
    <div class="field">
      <label>Select GNSS data models</label>
      <select id="kmltype_sel">
        <option value="getvelocities">Velocities</option>
        <option value="getcoseismic">Coseismic</option>
        <option value="getpostseismic">Postseismic</option>
        <option value="getdisplacement">Displacement</option>
        <option value="getmodel">Model</option>
      </select>
      <div id="modelHint" class="hint" style="margin-top:4px"></div>
    </div>
    <button class="btn btn-dark" id="btnDraw">✏️ Draw an area on map</button>
    <button class="btn btn-warn" id="btnClear">🗑 Clear GNSS Layers</button>
    <div id="rectInfo"></div>
    <div class="row2">
      <div class="field"><label>Center Latitude</label><input id="gs_latitude" value="33.5" /></div>
      <div class="field"><label>Center Longitude</label><input id="gs_longitude" value="-115.5" /></div>
    </div>
    <div class="row2">
      <div class="field"><label>Longitude Span (deg)</label><input id="gs_width" value="2" placeholder="1 degree" /></div>
      <div class="field"><label>Latitude Span (deg)</label><input id="gs_height" value="2" placeholder="1 degree" /></div>
    </div>
    <div class="field" id="f_epoch" style="display:none"><label>Epoch (YYYY-MM-DD)</label><input id="gs_epoch" placeholder="YYYY-MM-DD" /></div>
    <div class="field" id="f_epoch1" style="display:none"><label>Epoch 1 (YYYY-MM-DD)</label><input id="gs_epoch1" placeholder="YYYY-MM-DD" /></div>
    <div class="field" id="f_epoch2" style="display:none"><label>Epoch 2 (YYYY-MM-DD)</label><input id="gs_epoch2" placeholder="YYYY-MM-DD" /></div>
    <div class="field"><label>Ref. Site (4-letter code)</label><input id="gs_refsite" placeholder="4-letter code" /></div>
    <div class="field"><label>Scale</label><input id="gs_scale" placeholder="320 mm/yr/deg" /></div>
    <div class="field" id="f_ctwin" style="display:none"><label>Coseismic Win. (years)</label><input id="gs_ctwin" placeholder="0.1 years" /></div>
    <div class="field" id="f_ptwin" style="display:none"><label>Postseismic Win. (years)</label><input id="gs_ptwin" placeholder="2 years" /></div>
    <div class="field" id="f_dwin1" style="display:none"><label>Av. Win. 1 (days)</label><input id="gs_dwin1" placeholder="10 days" /></div>
    <div class="field" id="f_dwin2" style="display:none"><label>Av. Win. 2 (days)</label><input id="gs_dwin2" placeholder="10 days" /></div>
    <div class="field"><label>Output Prefix</label><input id="gs_outputprefix" placeholder="optional prefix" /></div>
    <label class="check" id="w_ngl" style="display:none"><input type="checkbox" id="gs_analysisCenter" /> Use NGL data</label>
    <label class="check"><input type="checkbox" id="markerSize" /> Minimize Marker Size</label>
    <label class="check"><input type="checkbox" id="gs_vabs" /> Display absolute verticals</label>
    <label class="check"><input type="checkbox" id="gs_eon" /> Include error ellipses</label>
    <label class="check" id="w_interp" style="display:none"><input type="checkbox" id="gs_interpolation" /> Interpolation</label>
    <div id="interpBox" style="display:none;border:1px solid #ccc;border-radius:4px;padding:8px;margin-bottom:8px">
      <div class="field"><label>Methods</label>
        <select id="gs_interpolationtype">
          <option value="linear">linear</option><option value="gaussian">gaussian</option>
          <option value="power">power</option><option value="exponential">exponential</option>
          <option value="spherical">spherical</option>
        </select>
      </div>
      <div class="field"><label>Grid spacing (deg)</label><input id="gs_gridspacing" placeholder="0.018 degree" /></div>
      <div class="field"><label>Azimuth (deg)</label><input id="gs_azimuth" placeholder="-5 degree" /></div>
      <div class="field"><label>Elevation Angle (deg)</label><input id="gs_elevationangle" placeholder="60 degree" /></div>
    </div>
    <button class="btn btn-go" id="btnRun">Run</button>
    <div id="spinner"><span class="spin"></span>Querying GNSS service…</div>
    <p class="hint">Data source:<br />
      <a href="https://sideshow.jpl.nasa.gov/post/series.html" target="_blank">GNSS Time Series</a><br />
      <a href="https://sideshow.jpl.nasa.gov/post/tables/table2.html" target="_blank">Station list (4-letter codes)</a><br />
      <a id="nglLink" style="display:none" href="http://geodesy.unr.edu/NGLStationPages/gpsnetmap/GPSNetMap.html" target="_blank">NGL GPS Networks</a>
    </p>
    <div id="outputs"><h4>Outputs</h4><div id="outList"></div></div>
  </div>
  <!-- RIGHT PANEL : Leaflet map -->
  <div id="right"><div id="map"></div></div>
</div>
<script>
/* ===== Left panel: model -> parameters =====================================
   Standalone block with NO external dependencies, executed BEFORE the map
   libraries load, so the parameter form always switches even if a map
   script fails. Field mapping mirrors the v-if conditions in
   reference/GNSS.vue:
     Epoch              -> getcoseismic, getpostseismic
     Epoch 1 / Epoch 2  -> getdisplacement, getmodel
     Coseismic Win.     -> getcoseismic, getpostseismic
     Postseismic Win.   -> getpostseismic
     Av. Win. 1 / 2, Use NGL data, Interpolation -> getdisplacement
     center lat/lon, spans, Ref. Site, Scale, Output Prefix,
     Minimize Marker Size, absolute verticals, error ellipses -> all models
   ============================================================================ */
const $ = id => document.getElementById(id);
const MODEL_PARAMS = {
  getvelocities:   { epoch: false, epochs: false, ctwin: false, ptwin: false, dwins: false, ngl: false, interp: false },
  getcoseismic:    { epoch: true,  epochs: false, ctwin: true,  ptwin: false, dwins: false, ngl: false, interp: false },
  getpostseismic:  { epoch: true,  epochs: false, ctwin: true,  ptwin: true,  dwins: false, ngl: false, interp: false },
  getdisplacement: { epoch: false, epochs: true,  ctwin: false, ptwin: false, dwins: true,  ngl: true,  interp: true  },
  getmodel:        { epoch: false, epochs: true,  ctwin: false, ptwin: false, dwins: false, ngl: false, interp: false },
};
const MODEL_HINTS = {
  getvelocities: 'Interseismic velocities within the selected area.',
  getcoseismic: 'Coseismic offsets for the earthquake on Epoch.',
  getpostseismic: 'Postseismic deformation following the earthquake on Epoch.',
  getdisplacement: 'Displacements between Epoch 1 and Epoch 2.',
  getmodel: 'Model predictions between Epoch 1 and Epoch 2.',
};
function applyModel() {
  const m = $('kmltype_sel').value;
  const cfg = MODEL_PARAMS[m] || MODEL_PARAMS.getvelocities;
  const show = (id, v) => { $(id).style.display = v ? '' : 'none'; };
  show('f_epoch', cfg.epoch);
  show('f_epoch1', cfg.epochs);
  show('f_epoch2', cfg.epochs);
  show('f_ctwin', cfg.ctwin);
  show('f_ptwin', cfg.ptwin);
  show('f_dwin1', cfg.dwins);
  show('f_dwin2', cfg.dwins);
  show('w_ngl', cfg.ngl);
  show('w_interp', cfg.interp);
  show('nglLink', cfg.ngl);
  // interpolation sub-options only make sense for the displacement model
  show('interpBox', cfg.interp && $('gs_interpolation').checked);
  $('modelHint').textContent = MODEL_HINTS[m] || '';
}
$('kmltype_sel').addEventListener('change', applyModel);
$('gs_interpolation').addEventListener('change', applyModel);
applyModel();
</script>
<script src="/static/vendor/leaflet/leaflet.js"></script>
<script src="/static/vendor/leaflet-draw/leaflet.draw.js"></script>
<script src="/static/vendor/togeojson/togeojson.umd.js"></script>
<script>
/* ===== Right panel: Leaflet map (guarded so a map failure can't break the form above) ===== */
let map = null;
let drawnItems = null;
if (typeof L === 'undefined') {
  document.getElementById('map').innerHTML = '<div style="padding:24px;font-size:14px;color:#721c24">Could not load the map library from <code>/static/vendor/</code>. The parameter form on the left still works.</div>';
  document.getElementById('btnDraw').disabled = true;
} else {
map = L.map('map').setView([33.5, -115.5], 7);
const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
const esri = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Esri World Imagery' });
L.control.layers({ 'OSM': osm, 'Esri Imagery': esri }).addTo(map);
L.control.scale().addTo(map);

drawnItems = new L.FeatureGroup().addTo(map);
if (L.Draw && L.DrawControl) {
  const drawControl = new L.DrawControl({ draw: { rectangle: true, polygon: false, polyline: false, circle: false, marker: false, circlemarker: false }, edit: { featureGroup: drawnItems } });
  map.addControl(drawControl);
  $('btnDraw').onclick = () => { new L.Draw.Rectangle(map).enable(); };
} else {
  $('btnDraw').disabled = true;
}
map.on(L.Draw.Event.CREATED, e => {
  drawnItems.clearLayers();
  const layer = e.layer; drawnItems.addLayer(layer);
  const b = layer.getBounds();
  const c = b.getCenter();
  $('gs_latitude').value = c.lat.toFixed(5);
  $('gs_longitude').value = c.lng.toFixed(5);
  $('gs_height').value = Math.abs(b.getNorth() - b.getSouth()).toFixed(5);
  $('gs_width').value = Math.abs(b.getEast() - b.getWest()).toFixed(5);
  const info = $('rectInfo');
  info.style.display = 'block';
  info.textContent = `Selected area center (${c.lat.toFixed(4)}, ${c.lng.toFixed(4)}), span ${Math.abs(b.getEast()-b.getWest()).toFixed(3)} x ${Math.abs(b.getNorth()-b.getSouth()).toFixed(3)} deg`;
});
} // end else (Leaflet present)

const gnssLayers = {};   // name -> L layer
let legendCtl = null, colorbarUrl = null;

function kmlColorToCss(kmlColor, fallback) {
  if (!kmlColor || kmlColor.length < 8) return fallback;
  const a = kmlColor.slice(0,2), b = kmlColor.slice(2,4), g = kmlColor.slice(4,6), r = kmlColor.slice(6,8);
  return '#' + r + g + b;
}
function addKmlTextToMap(text, name) {
  if (!map || typeof toGeoJSON === 'undefined') return;
  const xml = new DOMParser().parseFromString(text, 'text/xml');
  let gj;
  try { gj = toGeoJSON.kml(xml); } catch (err) { console.error('KML parse failed', err); return; }
  if (!gj || !gj.features || !gj.features.length) return;
  const styleOf = f => {
    const st = (f.properties && (f.properties.style || f.properties.Style)) || {};
    return { color: kmlColorToCss(st.color, '#007800'), weight: parseInt(st.width || 2, 10) };
  };
  const layer = L.geoJSON(gj, {
    style: styleOf,
    pointToLayer: (f, latlng) => {
      const mini = $('markerSize').checked;
      return L.circleMarker(latlng, { radius: mini ? 2 : 4, color: '#003300', weight: 1, fillColor: '#78ff78', fillOpacity: 0.9 });
    },
    onEachFeature: (f, l) => {
      const p = f.properties || {};
      const html = (p.description || p.name || '');
      if (html) l.bindPopup(String(html).slice(0, 2000));
    }
  });
  if (gnssLayers[name] && map) map.removeLayer(gnssLayers[name]);
  gnssLayers[name] = layer;
  if (map && $('ck_' + CSS.escape(name))?.checked !== false) layer.addTo(map);
  try { if (map) map.flyToBounds(layer.getBounds(), { maxZoom: 10 }); } catch (e) {}
}
async function loadKmlUrl(url, name) {
  const r = await fetch(url);
  if (!r.ok) throw new Error('KML fetch failed ' + r.status);
  addKmlTextToMap(await r.text(), name);
}
function setLegend(url) {
  colorbarUrl = url;
  if (!map) return;
  if (!legendCtl) {
    legendCtl = L.control({ position: 'bottomright' });
    legendCtl.onAdd = () => { const d = L.DomUtil.create('div', 'legend'); d.id = 'interpLegend'; return d; };
    legendCtl.addTo(map);
  }
  const d = document.getElementById('interpLegend');
  if (d) d.innerHTML = url ? `<b>Interpolation</b><br><img src="${url}">` : '';
}
/* Model switching (MODEL_PARAMS / applyModel) lives in the standalone script
   block above so it runs before — and independent of — the map libraries. */

function extOf(url) {
  const tail = url.split('/').pop().split('?')[0];
  const parts = tail.split('_');
  return parts[parts.length - 1];
}
$('btnClear').onclick = () => {
  Object.values(gnssLayers).forEach(l => { if (map) map.removeLayer(l); });
  for (const k in gnssLayers) delete gnssLayers[k];
  if (drawnItems) drawnItems.clearLayers();
  $('outList').innerHTML = ''; $('outputs').style.display = 'none';
  setLegend(null);
  ['gs_latitude','gs_longitude','gs_width','gs_height'].forEach(id => $(id).value = '');
  $('rectInfo').style.display = 'none';
};
$('btnRun').onclick = async () => {
  const model = $('kmltype_sel').value;
  let func = model;
  if (model === 'getdisplacement' && $('gs_interpolation').checked) func = 'getInterpolation';
  const q = new URLSearchParams({
    function: func,
    lat: $('gs_latitude').value, lon: $('gs_longitude').value,
    width: $('gs_width').value, height: $('gs_height').value,
    epoch: $('gs_epoch').value, epoch1: $('gs_epoch1').value, epoch2: $('gs_epoch2').value,
    scale: $('gs_scale').value, ref: $('gs_refsite').value,
    ct: $('gs_ctwin').value, pt: $('gs_ptwin').value,
    dwin1: $('gs_dwin1').value, dwin2: $('gs_dwin2').value,
    prefix: $('gs_outputprefix').value,
    mon: $('markerSize').checked, eon: $('gs_eon').checked, vabs: $('gs_vabs').checked,
    analysisCenter: $('gs_analysisCenter').checked ? 'NGL' : '',
    gridspacing: $('gs_gridspacing').value, interpolationtype: $('gs_interpolationtype').value,
    azimuth: $('gs_azimuth').value, elevation: $('gs_elevationangle').value,
  });
  $('btnRun').disabled = true; $('spinner').style.display = 'block';
  try {
    const res = await fetch('/gpsservice/kml?' + q.toString());
    const props = await res.json();
    if (typeof props !== 'object' || !props.urls) { alert('Something wrong, please check input parameters!'); return; }
    const box = $('outputs'); box.style.display = 'block';
    const list = $('outList'); list.innerHTML = '';
    let vUrl = null, hUrl = null, firstPng = null, firstColorbar = null;
    const prefix = ($('gs_outputprefix').value || model);
    for (const u of props.urls) {
      const ext = extOf(u);
      const fname = u.split('/').pop();
      let lname = prefix + '_' + ext;
      if (ext === 'vertical.kml') vUrl = [u, lname];
      else if (ext === 'horizontal.kml') hUrl = [u, lname];
      else if (!ext.includes('colorbar') && ext.endsWith('.png') && !firstPng) firstPng = [u, lname];
      if (ext.includes('colorbar') && !firstColorbar) firstColorbar = u;
      const row = document.createElement('div');
      if (ext.endsWith('.kml') || ext.endsWith('.png')) {
        const ck = document.createElement('input');
        ck.type = 'checkbox'; ck.checked = true; ck.id = 'ck_' + lname;
        ck.onchange = () => {
          const lyr = gnssLayers[lname];
          if (!lyr) return;
          if (ck.checked) lyr.addTo(map); else map.removeLayer(lyr);
          if (lname.endsWith('.png')) setLegend(ck.checked ? u.replace('.png', '_colorbar.png') : null);
        };
        row.appendChild(ck);
        const sp = document.createElement('span'); sp.innerHTML = ` <a target="_blank" href="${u}">${fname}</a>`;
        row.appendChild(sp);
      } else {
        row.innerHTML = `<a target="_blank" href="${u}">${fname}</a>`;
      }
      list.appendChild(row);
    }
    if (hUrl && map) await loadKmlUrl(hUrl[0], hUrl[1]);
    if (vUrl && map) await loadKmlUrl(vUrl[0], vUrl[1]);
    // interpolation image overlays
    if (props.imagebounds && map && typeof L !== 'undefined' && L.imageOverlay) {
      const b = props.imagebounds; // [[south,west],[north,east]]
      for (const u of props.urls) {
        const ext = extOf(u);
        if (!ext.includes('colorbar') && ext.endsWith('.png')) {
          const lname = prefix + '_' + ext;
          const ov = L.imageOverlay(u, b, { opacity: 0.65 });
          if (gnssLayers[lname]) map.removeLayer(gnssLayers[lname]);
          gnssLayers[lname] = ov;
          if ($('ck_' + CSS.escape(lname))?.checked !== false) ov.addTo(map);
        }
      }
      const cb = firstColorbar || (firstPng ? firstPng[0].replace('.png', '_colorbar.png') : null);
      if (cb) setLegend(cb);
      try { if (map) map.flyToBounds(b); } catch (e) {}
    }
  } catch (err) {
    console.error(err);
    alert('Request failed: ' + err.message);
  } finally {
    $('btnRun').disabled = false; $('spinner').style.display = 'none';
  }
};
</script>
</body>
</html>
