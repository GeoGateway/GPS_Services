version: "3.8"

services:
  gps-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gps-service-fastapi
    ports:
      - "8000:8000"
    volumes:
      - gps-static-data:/app/static
      - gps-local-data:/app/localdata
      - ./GPSService.ini:/app/GPSService.ini
    restart: unless-stopped
    networks:
      - gps-network

volumes:
  gps-static-data:
    driver: local
  gps-local-data:
    driver: local

networks:
  gps-network:
    driver: bridge
